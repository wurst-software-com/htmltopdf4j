<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { margin: 28.8pt; }
  body { font-size: 11pt; }
  table { border-spacing: 0; width: 420pt; }
  td { border: 0.5pt solid #999; padding: 4pt 6pt; }
  .big { font-size: 22pt; }
  .mid { font-size: 14pt; }
  .small { font-size: 8pt; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="big">Bigbaseline</td>
      <td class="mid">Midbaseline</td>
      <td class="small">Smallbaseline</td>
    </tr>
    <tr>
      <td class="big" style="vertical-align: top">Bigtop</td>
      <td class="small" style="vertical-align: top">Smalltop</td>
      <td class="small" style="vertical-align: bottom">Smallbottom</td>
    </tr>
  </table>
</body>
</html>
