<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { margin: 28.8pt; }
  body { font-size: 12pt; line-height: 1.6; }
  .chip { background: #e8f1f8; border: 0.5pt solid #b9d3e8; border-radius: 8pt; padding: 1pt 6pt; }
  .mark { background: #fff3a0; }
  .plain { color: #444; }
  .narrow { width: 190pt; }
  .big { font-size: 24pt; }
</style>
</head>
<body>
  <p>Order <span class="chip">Chipone</span> and <span class="chip">Chiptwo</span> were raised together.</p>

  <p class="narrow">A <span class="mark">highlighted phrase that is long enough to be cut in two by the
  end of the line</span> keeps its top and bottom edges on both halves.</p>

  <p>A chip over two sizes: <span class="chip">small and <b class="big">BIG</b></span> together.</p>

  <p>Nothing at all is painted behind <span class="plain">an undecorated span</span>.</p>
</body>
</html>
