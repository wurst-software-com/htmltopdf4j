<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { margin: 28.8pt; }
  body { font-size: 12pt; }
  .filler { height: 700pt; background: #eef3f8; }
  .card { border: 1pt solid #669; background: #eef; padding: 6pt; page-break-inside: avoid; }
  .card p { margin: 0; line-height: 20pt; }
  table { border-spacing: 0; page-break-inside: avoid; margin-top: 10pt; }
  td { border: 0.5pt solid #999; padding: 3pt 6pt; }
</style>
</head>
<body>
  <div class="filler">Filler that leaves only a little of the first page free</div>

  <div class="card">
    <p>Cardfirst line of the card</p>
    <p>Card line two</p>
    <p>Card line three</p>
    <p>Card line four</p>
    <p>Card line five</p>
    <p>Cardlast line of the card</p>
  </div>

  <table>
    <tr><td>Rowfirst of the table</td></tr>
    <tr><td>Table row two</td></tr>
    <tr><td>Table row three</td></tr>
    <tr><td>Rowlast of the table</td></tr>
  </table>
</body>
</html>
