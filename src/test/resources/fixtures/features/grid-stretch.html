<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { margin: 28.8pt; }
  body { font-size: 11pt; }
  .grid { display: grid; grid-template-columns: 140pt 140pt; grid-template-rows: 100pt 100pt;
          gap: 10pt; }
  .grid > div { background: #eef3f8; border: 0.5pt solid #b9d3e8; padding: 4pt; }
</style>
</head>
<body>
  <div class="grid">
    <div>Stretchone</div>
    <div style="align-self: center">Centretwo</div>
    <div style="align-self: end">Endthree</div>
    <div style="height: 40pt">Ownfour</div>
  </div>
</body>
</html>
